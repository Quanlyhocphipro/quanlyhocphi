<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Học Phí Pro">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Quản Lý Học Phí Pro - Hệ Thống Quản Lý Lớp Học Toàn Diện</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #bootLoader {
      position: fixed;
      inset: 0;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    #bootLoader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #e2e8f0;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .boot-text {
      font-size: 13.5px;
      font-weight: 600;
      color: #475569;
    }
    /* Màn hình hướng dẫn mở Safari/Chrome khi mở từ Messenger/Zalo */
    #inAppNotice {
      display: none;
      position: fixed;
      inset: 0;
      background: #f8fafc;
      z-index: 10000;
      padding: 24px;
      box-sizing: border-box;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .notice-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px 20px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }
    .notice-title {
      font-size: 17px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 10px;
    }
    .notice-desc {
      font-size: 14px;
      color: #475569;
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .notice-step {
      background: #eef2ff;
      color: #3730a3;
      padding: 12px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .btn-copy {
      width: 100%;
      padding: 12px 16px;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="inAppNotice">
    <div class="notice-card">
      <div class="notice-title">Mở bằng Safari hoặc Chrome</div>
      <div class="notice-desc">
        Trình duyệt nội bộ của Messenger / Zalo chặn kết nối bảo mật của Google nên không thể tải ứng dụng trực tiếp tại đây.
      </div>
      <div class="notice-step">
        Bấm biểu tượng <strong>•••</strong> ở góc trên bên phải màn hình &rarr; Chọn <strong>Mở bằng trình duyệt bên ngoài</strong> (Safari / Chrome).
      </div>
      <button class="btn-copy" onclick="copyCurrentUrl(this)">Sao chép đường link ứng dụng</button>
    </div>
  </div>

  <div id="bootLoader">
    <div class="spinner"></div>
    <div class="boot-text">Đang kết nối hệ thống Quản Lý Học Phí Pro...</div>
  </div>

  <iframe
    id="appFrame"
    allow="clipboard-read; clipboard-write; downloads"
    referrerpolicy="strict-origin-when-cross-origin"
    onload="hideBootLoader()">
  </iframe>

  <script>
    var GAS_URL = "https://script.google.com/macros/s/AKfycbwGzqS1N4OKMqh6c7qoSpr9Ns7a7RbRV-ysjnkhWAmL4yKxM5lHINrsw8AJnW9HyIfSDA/exec";

    function copyCurrentUrl(btn) {
      var url = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function() {
          btn.textContent = "Đã sao chép! Hãy dán vào Safari / Chrome";
        });
      } else {
        prompt("Sao chép đường link bên dưới và mở bằng Safari / Chrome:", url);
      }
    }

    function hideBootLoader() {
      var loader = document.getElementById("bootLoader");
      if (!loader) return;
      loader.classList.add("fade-out");
      setTimeout(function() {
        if (loader.parentNode) loader.parentNode.removeChild(loader);
      }, 280);
    }

    (function initAppFrame() {
      var ua = navigator.userAgent || "";
      var isInAppBrowser = /FBAN|FBAV|Messenger|Zalo|Line|Instagram|MicroMessenger|BytedanceWebview/i.test(ua);

      if (isInAppBrowser) {
        document.getElementById("bootLoader").style.display = "none";
        document.getElementById("inAppNotice").style.display = "flex";
        return;
      }

      var params = new URLSearchParams(window.location.search);
      params.set("host", window.location.origin + window.location.pathname);

      var finalUrl = GAS_URL + "?" + params.toString() + (window.location.hash || "");
      var frame = document.getElementById("appFrame");
      frame.src = finalUrl;

      setTimeout(hideBootLoader, 5000);
    })();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").catch(function() {});
      });
    }
  </script>
</body>
</html>
