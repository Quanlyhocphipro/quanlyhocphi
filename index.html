<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Học Phí Pro">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Quản Lý Học Phí Pro - Hệ Thống Quản Lý Lớp Học Toàn Diện</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #bootLoader {
      position: fixed;
      inset: 0;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    #bootLoader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #e2e8f0;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .boot-text {
      font-size: 13.5px;
      font-weight: 600;
      color: #475569;
    }
  </style>
</head>
<body>
  <div id="bootLoader">
    <div class="spinner"></div>
    <div class="boot-text">Đang kết nối hệ thống Quản Lý Học Phí Pro...</div>
  </div>

  <iframe
    id="appFrame"
    allow="clipboard-read; clipboard-write; downloads"
    referrerpolicy="strict-origin-when-cross-origin"
    onload="hideBootLoader()">
  </iframe>

  <script>
    var GAS_URL = "https://script.google.com/macros/s/AKfycbwGzqS1N4OKMqh6c7qoSpr9Ns7a7RbRV-ysjnkhWAmL4yKxM5lHINrsw8AJnW9HyIfSDA/exec";

    function hideBootLoader() {
      var loader = document.getElementById("bootLoader");
      if (!loader) return;
      loader.classList.add("fade-out");
      setTimeout(function() {
        if (loader.parentNode) loader.parentNode.removeChild(loader);
      }, 280);
    }

    (function initAppFrame() {
      var params = new URLSearchParams(window.location.search);
      params.set("host", window.location.origin + window.location.pathname);

      var finalUrl = GAS_URL + "?" + params.toString() + (window.location.hash || "");
      var frame = document.getElementById("appFrame");
      frame.src = finalUrl;

      setTimeout(hideBootLoader, 5000);
    })();

    // Đăng ký Service Worker để kích hoạt cài đặt PWA
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").catch(function() {});
      });
    }
  </script>
</body>
</html>
